name: AlaraBO checks
on:
  pull_request:
  push:
    branches: [main, scientific-reliability-v1-1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - run: bun install --frozen-lockfile
      - run: bun audit
  secret-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check reachable Git history for common credential patterns
        run: bash scripts/check-secrets.sh
